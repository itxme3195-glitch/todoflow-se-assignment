name: TodoFlow CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run smoke tests
        run: npm test
      - name: Validate required files
        run: test -f index.html && test -f styles.css && test -f app.js
